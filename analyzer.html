<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPSC Mains Micro-Theme Analyzer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-2: #334155;
            --border: #334155;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --radius: 12px;
        }

        body.light-mode {
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface-2: #f1f5f9;
            --border: #e2e8f0;
            --text: #0f172a;
            --text-secondary: #64748b;
            --accent: #4f46e5;
            --accent-hover: #6366f1;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }

        .header {
            height: 70px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            flex-shrink: 0;
            z-index: 10;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .theme-toggle {
            background: var(--surface-2);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
        }

        .theme-toggle:hover { background: var(--accent); color: white; border-color: var(--accent); }

        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 320px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .paper-tabs {
            display: flex;
            padding: 12px;
            gap: 8px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
        }

        .paper-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s;
        }

        .paper-tab.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .subject-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .subject-group {
            margin-bottom: 16px;
        }

        .subject-title {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            padding: 8px 12px;
        }

        .theme-btn {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: var(--surface-2);
            color: var(--text);
            border: 1px solid transparent;
            border-radius: 8px;
            margin-bottom: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .theme-btn:hover { border-color: var(--accent); transform: translateX(2px); }
        .theme-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

        .count-badge {
            background: rgba(0,0,0,0.2);
            padding: 2px 8px;
            border-radius: 99px;
            font-size: 11px;
            font-weight: 800;
            color: inherit;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg);
        }

        .content-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
        }

        .content-header h2 { font-size: 24px; font-weight: 800; }
        .content-header p { color: var(--text-secondary); font-size: 14px; margin-top: 4px; }

        .questions-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        .q-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            transition: transform 0.2s;
        }

        .q-card:hover { transform: translateY(-2px); border-color: var(--accent); }

        .q-meta {
            display: flex;
            gap: 12px;
            margin-bottom: 10px;
        }

        .badge {
            font-size: 12px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
        }

        .badge-year { background: var(--surface-2); color: var(--text-secondary); }
        .badge-marks { background: #fef3c7; color: #92400e; }
        body.light-mode .badge-marks { background: #fef3c7; color: #92400e; } /* Keep consistent in light mode */

        .q-text {
            font-size: 16px;
            line-height: 1.6;
            font-weight: 400;
        }

        .welcome-msg {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .welcome-msg h2 { font-size: 28px; color: var(--text); margin-bottom: 10px; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .sidebar { width: 100%; max-height: 40vh; border-bottom: 1px solid var(--border); border-right: none; }
            .main-content { min-height: 60vh; }
            .header h1 { font-size: 16px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>📊 UPSC Mains Analyzer</h1>
        <div class="header-controls">
            <button class="theme-toggle" onclick="toggleTheme()">🌓 Toggle Theme</button>
        </div>
    </div>

    <div class="container">
        <div class="sidebar">
            <div class="paper-tabs">
                <button class="paper-tab active" onclick="selectPaper('GS1')">GS1</button>
                <button class="paper-tab" onclick="selectPaper('GS2')">GS2</button>
                <button class="paper-tab" onclick="selectPaper('GS3')">GS3</button>
                <button class="paper-tab" onclick="selectPaper('GS4')">GS4</button>
            </div>
            <div class="subject-list" id="theme-sidebar">
                <div class="welcome-msg" style="padding: 20px;">Loading Themes...</div>
            </div>
        </div>

        <div class="main-content">
            <div class="content-header">
                <h2 id="content-title">Welcome!</h2>
                <p id="content-subtitle">Select a micro-theme from the left sidebar to see its PYQs.</p>
            </div>
            <div class="questions-container" id="questions-view">
                <div class="welcome-msg">
                    <h2>👈 Select a Theme</h2>
                    <p>Explore GS 1, 2, 3, and 4 papers in a beautiful, dark-mode friendly interface.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Set initial theme based on user preference or default to dark
        const savedTheme = localStorage.getItem('qs-theme') || 'dark';
        document.body.classList.toggle('light-mode', savedTheme === 'light');

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            localStorage.setItem('qs-theme', isLight ? 'light' : 'dark');
        }

        // State
        let currentPaper = 'GS1';
        let allData = {};
        let currentThemeId = null;

        // Fetch Data
        async function loadData() {
            const files = {
                'GS1': './gs1_themes.json',
                'GS2': './gs2_themes.json',
                'GS3': './gs3_themes.json',
                'GS4': './gs4_themes.json'
            };

            try {
                const results = await Promise.all(
                    Object.keys(files).map(async key => {
                        try {
                            const res = await fetch(files[key]);
                            if (!res.ok) throw new Error('Not Found');
                            const data = await res.json();
                            return { key, data };
                        } catch (e) {
                            return { key, data: {} };
                        }
                    })
                );

                results.forEach(result => {
                    allData[result.key] = result.data;
                });

                selectPaper('GS1');

            } catch (error) {
                console.error("Error loading JSON files", error);
                document.getElementById('theme-sidebar').innerHTML = `<div class="welcome-msg" style="padding: 20px;">Error loading JSON. Ensure the files are in the same folder and served over HTTP.</div>`;
            }
        }

        // Select GS Paper
        function selectPaper(paper) {
            currentPaper = paper;
            document.querySelectorAll('.paper-tab').forEach(tab => {
                tab.classList.toggle('active', tab.textContent === paper);
            });
            
            renderSidebar();
        }

        // Render Sidebar based on selected paper
        function renderSidebar() {
            const sidebar = document.getElementById('theme-sidebar');
            sidebar.innerHTML = '';

            const paperData = allData[currentPaper];
            if (!paperData || Object.keys(paperData).length === 0) {
                sidebar.innerHTML = `<div class="welcome-msg" style="padding: 20px;">No data found for ${currentPaper}</div>`;
                return;
            }

            for (const [subject, themes] of Object.entries(paperData)) {
                const subjectDiv = document.createElement('div');
                subjectDiv.className = 'subject-group';

                const subjectTitle = document.createElement('div');
                subjectTitle.className = 'subject-title';
                subjectTitle.textContent = subject;
                subjectDiv.appendChild(subjectTitle);

                themes.forEach(theme => {
                    const btn = document.createElement('button');
                    btn.className = 'theme-btn';
                    btn.innerHTML = `<span>${theme.microtheme}</span> <span class="count-badge">${theme.year}</span>`;
                    
                    // Generate a unique ID for the theme (using microtheme + year for uniqueness)
                    const themeId = `${currentPaper}-${subject}-${theme.microtheme}`;
                    btn.onclick = () => selectTheme(themeId, btn, theme);
                    
                    subjectDiv.appendChild(btn);
                });

                sidebar.appendChild(subjectDiv);
            }
        }

        // Select a specific micro-theme
        function selectTheme(themeId, btnElement, theme) {
            // Highlight button
            document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            
            // Update header
            document.getElementById('content-title').textContent = theme.microtheme;
            document.getElementById('content-subtitle').textContent = `Year: ${theme.year} | Marks: ${theme.marks}`;

            // Render question
            const view = document.getElementById('questions-view');
            view.innerHTML = `
                <div class="q-card">
                    <div class="q-meta">
                        <span class="badge badge-year">Year: ${theme.year}</span>
                        <span class="badge badge-marks">Marks: ${theme.marks}</span>
                    </div>
                    <div class="q-text">${theme.key_pyq}</div>
                </div>
            `;
        }

        // Initialize
        loadData();
    </script>
</body>
</html>
