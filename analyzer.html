<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPSC Mains PYQ Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc; --surface: #ffffff; --surface-2: #f1f5f9;
            --border: #e2e8f0; --text: #0f172a; --text-soft: #64748b;
            --accent: #6366f1; --accent-soft: #e0e7ff;
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
        }
        body.dark-mode {
            --bg: #0f172a; --surface: #1e293b; --surface-2: #334155;
            --border: #334155; --text: #f1f5f9; --text-soft: #94a3b8;
            --accent: #818cf8; --accent-soft: #312e81;
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.3), 0 1px 2px -1px rgb(0 0 0 / 0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }

        /* Sidebar */
        .sidebar { width: 350px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); }
        .logo { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .theme-toggle { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; margin-top: 15px; width: 100%; text-align: center; }
        .theme-toggle:hover { background: var(--accent-soft); color: var(--accent); }

        .tabs { display: flex; padding: 12px; gap: 8px; background: var(--surface); border-bottom: 1px solid var(--border); }
        .tab { flex: 1; padding: 10px; text-align: center; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-weight: 700; color: var(--text-soft); transition: 0.2s; }
        .tab.active { background: var(--accent); color: white; border-color: var(--accent); }

        .nav-scroll { flex: 1; overflow-y: auto; padding: 12px; }
        .subject-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-soft); font-weight: 800; margin: 16px 8px 8px; }
        
        /* Accordion Grouping */
        .group-btn { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: var(--surface-2); border: 1px solid transparent; border-radius: 8px; margin-bottom: 4px; cursor: pointer; font-weight: 700; }
        .group-btn:hover { border-color: var(--accent); }
        .group-btn.active-group { background: var(--accent-soft); color: var(--accent); }
        .group-arrow { transition: transform 0.2s; }
        .group-btn.open .group-arrow { transform: rotate(90deg); }
        
        .micro-list { display: none; margin-left: 10px; border-left: 2px solid var(--border); padding-left: 8px; }
        .micro-list.open { display: block; }
        .micro-btn { width: 100%; text-align: left; padding: 8px 12px; background: transparent; border: none; border-radius: 6px; cursor: pointer; color: var(--text-soft); font-size: 14px; font-weight: 500; margin-bottom: 2px; }
        .micro-btn:hover { background: var(--surface-2); color: var(--text); }
        .micro-btn.active-micro { background: var(--accent); color: white; font-weight: 600; }

        /* Main Content */
        .main-content { flex: 1; overflow-y: auto; padding: 30px; display: flex; flex-direction: column; gap: 20px; }
        .header h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
        .header p { color: var(--text-soft); font-size: 14px; }

        /* Stats */
        .stats-row { display: flex; gap: 16px; }
        .stat-card { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); }
        .stat-num { font-size: 26px; font-weight: 800; }
        .stat-lbl { font-size: 12px; color: var(--text-soft); font-weight: 600; }

        /* Question Card */
        .question-area { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 30px; box-shadow: var(--shadow); flex: 1; }
        .q-meta { display: flex; gap: 12px; margin-bottom: 16px; }
        .badge { padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: 700; }
        .badge-year { background: var(--accent-soft); color: var(--accent); }
        .badge-marks { background: #fef3c7; color: #92400e; }
        .badge-paper { background: #d1fae5; color: #065f46; }
        
        .q-text { font-size: 20px; line-height: 1.6; font-weight: 500; margin-bottom: 20px; }
        .q-theme { color: var(--text-soft); font-size: 14px; border-top: 1px solid var(--border); padding-top: 15px; }
        
        .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-soft); }
        .empty-state h2 { font-size: 24px; margin-bottom: 10px; color: var(--text); }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <div class="logo">🦉 UPSC Craft</div>
            <button class="theme-toggle" onclick="toggleTheme()">🌓 Toggle Theme</button>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="selectPaper('GS1')">GS1</button>
            <button class="tab" onclick="selectPaper('GS2')">GS2</button>
            <button class="tab" onclick="selectPaper('GS3')">GS3</button>
            <button class="tab" onclick="selectPaper('GS4')">GS4</button>
        </div>

        <div class="nav-scroll" id="sidebar-nav">
            <!-- Dynamic content -->
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>PYQ Intelligence</h1>
            <p>Click a Micro-theme on the left to view questions</p>
        </div>

        <div class="stats-row">
            <div class="stat-card"><div class="stat-num" id="stat-qs">0</div><div class="stat-lbl">Total PYQs</div></div>
            <div class="stat-card"><div class="stat-num" id="stat-themes">0</div><div class="stat-lbl">Total Themes</div></div>
            <div class="stat-card"><div class="stat-num" id="stat-major">0</div><div class="stat-lbl">Major Themes</div></div>
        </div>

        <div class="question-area" id="question-view">
            <div class="empty-state">
                <h2>👈 Select a theme</h2>
                <p>Choose a micro-theme to see the actual UPSC question here.</p>
            </div>
        </div>
    </div>

    <script>
        // Theme Handling
        const savedTheme = localStorage.getItem('pyq-theme') || 'light';
        if(savedTheme === 'dark') document.body.classList.add('dark-mode');
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('pyq-theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
        }

        // State
        let allData = {};
        let currentPaper = 'GS1';

        // Logic to Group Microthemes (e.g., "Kingdoms x Chola" into Major Theme "Kingdoms")
        function processData(rawData, paperKey) {
            const grouped = {};
            const rawPaperData = rawData[paperKey] || {};

            for (const subject in rawPaperData) {
                if (!grouped[subject]) grouped[subject] = {};

                rawPaperData[subject].forEach(q => {
                    // Extract Major Theme by splitting on " x "
                    const parts = q.microtheme.split(' x ');
                    const majorTheme = parts.length > 1 ? parts[0].trim() : 'General';
                    const microName = q.microtheme;

                    if (!grouped[subject][majorTheme]) grouped[subject][majorTheme] = [];
                    grouped[subject][majorTheme].push(q);
                });
            }
            return grouped;
        }

        // Fetch Data
        async function loadData() {
            const files = {
                'GS1': './gs1_themes.json',
                'GS2': './gs2_themes.json',
                'GS3': './gs3_themes.json',
                'GS4': './gs4_themes.json'
            };

            const results = await Promise.all(Object.entries(files).map(async ([paper, url]) => {
                try {
                    const res = await fetch(url);
                    if (!res.ok) return { paper, data: {} };
                    return { paper, data: await res.json() };
                } catch (e) {
                    return { paper, data: {} };
                }
            }));

            results.forEach(res => {
                // Process to create 3-level hierarchy: Subject -> Major Theme -> Questions
                allData[res.paper] = processData(res.data, res.paper);
            });

            selectPaper('GS1');
        }

        // UI: Select Paper
        function selectPaper(paper) {
            currentPaper = paper;
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.toggle('active', tab.textContent === paper);
            });
            renderSidebar();
            // Clear question viewer on paper switch
            document.getElementById('question-view').innerHTML = `
                <div class="empty-state">
                    <h2>👈 Select a theme</h2>
                    <p>Choose a micro-theme to see the actual UPSC question here.</p>
                </div>`;
            updateStats();
        }

        // UI: Render Sidebar
        function renderSidebar() {
            const nav = document.getElementById('sidebar-nav');
            nav.innerHTML = '';

            const paperData = allData[currentPaper];
            if (!paperData || Object.keys(paperData).length === 0) {
                nav.innerHTML = `<div style="padding: 20px; color: var(--text-soft);">No data found for ${currentPaper}. Ensure JSON file is in the correct folder.</div>`;
                return;
            }

            // Loop through Subjects (e.g., Indian Heritage & Culture)
            for (const subject in paperData) {
                const subTitle = document.createElement('div');
                subTitle.className = 'subject-title';
                subTitle.textContent = subject;
                nav.appendChild(subTitle);

                // Loop through Major Themes (e.g., Kingdoms, General)
                for (const majorTheme in paperData[subject]) {
                    const themeArr = paperData[subject][majorTheme];
                    const themeId = `${currentPaper}-${subject}-${majorTheme}`;

                    // Major Theme Button
                    const groupBtn = document.createElement('button');
                    groupBtn.className = 'group-btn';
                    groupBtn.innerHTML = `<span>${majorTheme}</span> <span class="group-arrow">›</span>`;
                    groupBtn.onclick = () => {
                        const list = document.getElementById(`list-${themeId}`);
                        const isOpen = list.classList.contains('open');
                        
                        // Close other open lists
                        document.querySelectorAll('.micro-list').forEach(l => l.classList.remove('open'));
                        document.querySelectorAll('.group-btn').forEach(b => b.classList.remove('open'));

                        if (!isOpen) {
                            list.classList.add('open');
                            groupBtn.classList.add('open');
                        }
                    };
                    nav.appendChild(groupBtn);

                    // Microtheme List
                    const microList = document.createElement('div');
                    microList.className = 'micro-list';
                    microList.id = `list-${themeId}`;

                    themeArr.forEach(q => {
                        const microBtn = document.createElement('button');
                        microBtn.className = 'micro-btn';
                        microBtn.textContent = q.microtheme;
                        microBtn.onclick = () => showQuestion(q, microBtn);
                        microList.appendChild(microBtn);
                    });

                    nav.appendChild(microList);
                }
            }
        }

        // UI: Show Question in Main Section
        function showQuestion(q, btnElement) {
            // Highlight active microtheme
            document.querySelectorAll('.micro-btn').forEach(b => b.classList.remove('active-micro'));
            btnElement.classList.add('active-micro');

            const view = document.getElementById('question-view');
            view.innerHTML = `
                <div class="q-meta">
                    <span class="badge badge-paper">${q.paper}</span>
                    <span class="badge badge-year">Year: ${q.year}</span>
                    <span class="badge badge-marks">Marks: ${q.marks}</span>
                </div>
                <div class="q-text">${q.key_pyq}</div>
                <div class="q-theme"><strong>Subject:</strong> ${q.subject} <br> <strong>Micro-theme:</strong> ${q.microtheme}</div>
            `;
            view.scrollTop = 0;
        }

        // UI: Update Stats
        function updateStats() {
            let totalQs = 0;
            let totalThemes = 0;
            let totalMajor = 0;

            const paperData = allData[currentPaper] || {};
            for (const subject in paperData) {
                for (const major in paperData[subject]) {
                    totalMajor++;
                    totalThemes += paperData[subject][major].length;
                    totalQs += paperData[subject][major].length;
                }
            }

            document.getElementById('stat-qs').textContent = totalQs;
            document.getElementById('stat-themes').textContent = totalThemes;
            document.getElementById('stat-major').textContent = totalMajor;
        }

        // Initialize
        loadData();
    </script>
</body>
</html>
