<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPSC Craft | PYQ Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #f8fafc; --surface: #ffffff; --surface-2: #f1f5f9;
            --border: #e2e8f0; --text: #0f172a; --text-soft: #64748b;
            --accent: #e11d48; --accent-soft: #ffe4e6;
            --primary: #6366f1; --primary-soft: #e0e7ff;
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
        }
        body.dark-mode {
            --bg: #0f172a; --surface: #1e293b; --surface-2: #334155;
            --border: #334155; --text: #f1f5f9; --text-soft: #94a3b8;
            --accent: #f43f5e; --accent-soft: #4c0519;
            --primary: #818cf8; --primary-soft: #312e81;
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.3);
        }

        body.theme-gs1 { --accent: #e11d48; --accent-soft: #ffe4e6; }
        body.theme-gs2 { --accent: #3b82f6; --accent-soft: #dbeafe; }
        body.theme-gs3 { --accent: #10b981; --accent-soft: #d1fae5; }
        body.theme-gs4 { --accent: #8b5cf6; --accent-soft: #ede9fe; }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 90; display: none; opacity: 0; transition: opacity 0.3s; }
        .overlay.show { display: block; opacity: 1; }

        .header { height: 70px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; flex-shrink: 0; z-index: 100; }
        .logo { display: flex; align-items: center; gap: 12px; font-weight: 900; font-size: 18px; }
        .logo-icon { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: white; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .header-controls { display: flex; gap: 10px; align-items: center; }
        .btn-back { text-decoration: none; background: var(--surface-2); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 20px; font-weight: 800; font-size: 13px; transition: 0.2s; display: flex; align-items: center; gap: 4px; }
        .btn-back:hover { background: var(--accent); color: white; border-color: var(--accent); }
        .theme-toggle { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 20px; cursor: pointer; font-weight: 700; }
        .hamburger { display: none; background: none; border: none; color: var(--text); font-size: 24px; cursor: pointer; }

        .container { display: flex; flex: 1; overflow: hidden; position: relative; }

        .sidebar { width: 260px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 16px; gap: 12px; }
        .sidebar-tabs { display: flex; flex-direction: column; gap: 10px; }
        .paper-tab { padding: 16px; text-align: left; background: var(--surface-2); border: none; border-radius: 12px; cursor: pointer; font-weight: 900; color: var(--text-soft); font-size: 18px; transition: 0.2s; }
        .paper-tab.active { background: var(--accent); color: white; transform: translateX(4px); }

        .main-content { flex: 1; overflow-y: auto; padding: 24px; background: var(--bg); }

        .mobile-nav { display: none; position: sticky; top: 0; z-index: 10; background: var(--surface); padding: 12px; gap: 8px; border-bottom: 1px solid var(--border); }
        .m-btn { flex: 1; padding: 12px; text-align: center; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-weight: 900; color: var(--text-soft); }
        .m-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

        /* Dashboard / Capsules */
        .dashboard-section { padding: 20px 0 0 0; }
        .breadcrumb { margin-bottom: 16px; font-weight: 800; color: var(--text-soft); display: flex; gap: 8px; align-items: center; }
        .breadcrumb-btn { background: transparent; border: none; color: var(--accent); font-weight: 800; cursor: pointer; padding: 0; font-size: 14px; }
        
        .capsule-title { font-size: 14px; font-weight: 900; text-transform: uppercase; color: var(--text-soft); margin-bottom: 12px; }

        .capsule-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-bottom: 30px; }

        .capsule-btn { border: none; padding: 16px; border-radius: 50px; cursor: pointer; font-weight: 900; font-size: 14px; text-align: left; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.2); position: relative; }
        .capsule-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 16px rgba(0,0,0,0.3); }
        
        /* ACTIVE STATE (Collapse/Expand feedback) */
        .capsule-btn.active { outline: 4px solid var(--bg); box-shadow: 0 8px 20px rgba(0,0,0,0.4); transform: translateY(-2px); filter: brightness(1.1); }
        .capsule-btn.active::after { content: '▼'; position: absolute; right: 15px; top: 50%; transform: translateY(-50%); font-size: 12px; }
        .capsule-btn:not(.active)::after { content: '›'; position: absolute; right: 15px; top: 50%; transform: translateY(-50%); font-size: 16px; }
        
        .capsule-count { background: rgba(255,255,255,0.3); padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 800; }

        .grad-1 { background: linear-gradient(135deg, #f43f5e, #fb923c); }
        .grad-2 { background: linear-gradient(135deg, #3b82f6, #06b6d4); }
        .grad-3 { background: linear-gradient(135deg, #10b981, #84cc16); }
        .grad-4 { background: linear-gradient(135deg, #8b5cf6, #d946ef); }
        .grad-5 { background: linear-gradient(135deg, #f59e0b, #ef4444); }
        .grad-6 { background: linear-gradient(135deg, #06b6d4, #3b82f6); }
        .grad-7 { background: linear-gradient(135deg, #ec4899, #f97316); }
        .grad-8 { background: linear-gradient(135deg, #6366f1, #a855f7); }

        /* Questions */
        .questions-container { margin-top: -10px; padding-top: 10px; }
        .q-item { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
        .exp-badges { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
        .badge { font-size: 12px; font-weight: 900; padding: 5px 10px; border-radius: 50px; }
        .badge-year { background: var(--accent); color: white; }
        .badge-paper { background: var(--primary); color: white; }
        .badge-marks { background: var(--accent-soft); color: var(--accent); }
        .badge-subject { background: var(--surface-2); color: var(--text-soft); border: 1px solid var(--border); }
        .q-text { font-size: 20px; font-weight: 800; line-height: 1.6; margin-bottom: 20px; }
        .exp-actions { display: flex; gap: 12px; }
        .btn-action { background: var(--accent); color: white; border: none; padding: 10px 18px; border-radius: 10px; font-weight: 800; cursor: pointer; }
        .btn-save { background: transparent; border: 2px solid var(--border); color: var(--text); padding: 10px 18px; border-radius: 10px; font-weight: 800; cursor: pointer; }

        .charts-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-top: 20px; }
        .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); }
        .chart-card h3 { font-size: 16px; font-weight: 900; margin-bottom: 15px; }
        .chart-container { height: 250px; position: relative; }

        @media (max-width: 900px) {
            .header { padding: 0 12px; }
            .btn-back { padding: 8px; font-size: 12px; gap: 2px; }
            .btn-back span { display: none; }
            .theme-toggle { padding: 8px; font-size: 12px; }
            .hamburger { display: block; }
            .sidebar { position: fixed; top: 0; left: 0; height: 100%; transform: translateX(-100%); width: 280px; z-index: 95; }
            .sidebar.open { transform: translateX(0); }
            .main-content { padding: 16px; }
            .mobile-nav { display: flex; }
            .charts-row { grid-template-columns: 1fr; }
            .capsule-grid { grid-template-columns: 1fr 1fr; }
            .q-text { font-size: 18px; }
            .exp-actions { flex-direction: column; }
        }
    </style>
</head>
<body class="theme-gs1">

    <div class="overlay" id="overlay" onclick="toggleSidebar(false)"></div>

    <div class="header">
        <div class="logo"><div class="logo-icon">🦉</div> UPSC CRAFT</div>
        <div class="header-controls">
            <a href="index.html" class="btn-back"><span>←</span> <span>Back</span></a>
            <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
            <button class="hamburger" onclick="toggleSidebar(true)">☰</button>
        </div>
    </div>

    <div class="container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-tabs">
                <button class="paper-tab active" onclick="selectPaper('GS1')">GS1</button>
                <button class="paper-tab" onclick="selectPaper('GS2')">GS2</button>
                <button class="paper-tab" onclick="selectPaper('GS3')">GS3</button>
                <button class="paper-tab" onclick="selectPaper('GS4')">GS4</button>
            </div>
        </div>

        <div class="main-content">
            <div class="mobile-nav">
                <button class="m-btn active" onclick="selectPaper('GS1')">GS1</button>
                <button class="m-btn" onclick="selectPaper('GS2')">GS2</button>
                <button class="m-btn" onclick="selectPaper('GS3')">GS3</button>
                <button class="m-btn" onclick="selectPaper('GS4')">GS4</button>
            </div>

            <div class="dashboard-section" id="dashboard">
                <!-- Dynamically Loaded Here -->
            </div>

            <div class="charts-row">
                <div class="chart-card">
                    <h3 id="trend-title">Trend by Year</h3>
                    <div class="chart-container"><canvas id="trendChart"></canvas></div>
                </div>
                <div class="chart-card">
                    <h3 id="topic-title">Most Repeated Themes</h3>
                    <div class="chart-container"><canvas id="topicChart"></canvas></div>
                </div>
                <div class="chart-card">
                    <h3 id="radar-title">Theme Radar</h3>
                    <div class="chart-container"><canvas id="radarChart"></canvas></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleTheme() { document.body.classList.toggle('dark-mode'); }
        function toggleSidebar(open) {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            if(open) { sidebar.classList.add('open'); overlay.classList.add('show'); }
            else { sidebar.classList.remove('open'); overlay.classList.remove('show'); }
        }

        const MajorMap = {
            'GS1': { 'Art & Culture': ['Indian Heritage & Culture'], 'Modern History': ['Modern Indian History'], 'Post Independence': ['Post Independence'], 'World History': ['World History'], 'Physical Geography': ['Physical Geography'], 'Economic & Human Geography': ['Economic & Human Geography'], 'Indian society': ['Indian Society', 'Society'] },
            'GS2': { 'Polity': ['Polity'], 'Governance': ['Governance'], 'Social Justice': ['Social Justice'], 'International Relations': ['International Relations'] },
            'GS3': { 'Economy': ['Economic Development'], 'Agriculture': ['Agriculture'], 'Internal Security': ['Internal Security'], 'Environment & Disaster Management': ['Environment', 'Disaster Management'], 'Science & Tech': ['Science & Technology'] },
            'GS4': { 'Ethics Theory': ['Ethics'], 'Case Studies': ['Case Studies'] }
        };

        let allData = {};
        let currentPaper = 'GS1';
        let currentSubject = null;
        let currentMicroTheme = null;
        let myCharts = {};

        async function loadData() {
            const files = { 'GS1': './gs1_themes.json', 'GS2': './gs2_themes.json', 'GS3': './gs3_themes.json', 'GS4': './gs4_themes.json' };
            const results = await Promise.all(Object.entries(files).map(async ([paper, url]) => {
                try { const res = await fetch(url); if (!res.ok) return { paper, data: {} }; return { paper, data: await res.json() }; } catch(e) { return { paper, data: {} }; }
            }));

            results.forEach(res => {
                const grouped = {};
                const rawPaperData = res.data[res.paper] ? res.data[res.paper] : res.data;
                
                for (const broadSubject in MajorMap[res.paper]) {
                    const rawKeys = MajorMap[res.paper][broadSubject];
                    grouped[broadSubject] = [];
                    rawKeys.forEach(key => {
                        if(rawPaperData[key]) {
                            rawPaperData[key].forEach(q => {
                                q.subject = broadSubject;
                                q.paper = res.paper;
                            });
                            grouped[broadSubject] = grouped[broadSubject].concat(rawPaperData[key]);
                        }
                    });
                }

                for (const subject in rawPaperData) {
                    let isFound = false;
                    for(const broadSubject in MajorMap[res.paper]) {
                        if(MajorMap[res.paper][broadSubject].includes(subject)) isFound = true;
                    }
                    if(!isFound) {
                        rawPaperData[subject].forEach(q => {
                            q.subject = 'General';
                            q.paper = res.paper;
                        });
                        grouped['General'] = (grouped['General'] || []).concat(rawPaperData[subject]);
                    }
                }
                allData[res.paper] = grouped;
            });

            selectPaper('GS1');
        }

        function selectPaper(paper) {
            currentPaper = paper;
            currentSubject = null;
            currentMicroTheme = null;
            
            document.querySelectorAll('.paper-tab').forEach(tab => tab.classList.toggle('active', tab.textContent === paper));
            document.querySelectorAll('.m-btn').forEach(tab => tab.classList.toggle('active', tab.textContent === paper));
            
            document.body.className = `theme-${paper.toLowerCase()}`;
            
            renderDashboard();
            renderCharts();
            toggleSidebar(false);
        }

        const gradClasses = ['grad-1', 'grad-2', 'grad-3', 'grad-4', 'grad-5', 'grad-6', 'grad-7', 'grad-8'];

        // NEW: KEEPS TAGS VISIBLE AND EXPANDS/COLLAPSES QUESTIONS BELOW THEM
        function renderDashboard() {
            const container = document.getElementById('dashboard');
            container.innerHTML = '';
            const paperData = allData[currentPaper];

            if (!paperData) {
                container.innerHTML = `<div style="padding: 40px; text-align: center;">No data found for ${currentPaper}.</div>`;
                return;
            }

            // 1. Show Subjects (If no subject selected)
            if (!currentSubject) {
                container.innerHTML = `<h2 style="margin-bottom: 20px;">Select a Subject</h2>`;
                const grid = document.createElement('div');
                grid.className = 'capsule-grid';
                
                let gradIndex = 0;
                for (const subject in paperData) {
                    const subjectQs = paperData[subject];
                    const btn = document.createElement('button');
                    btn.className = `capsule-btn ${gradClasses[gradIndex % gradClasses.length]}`;
                    gradIndex++;
                    btn.innerHTML = `<span>${subject}</span> <span class="capsule-count">${subjectQs.length}</span>`;
                    btn.onclick = () => { currentSubject = subject; currentMicroTheme = null; renderDashboard(); };
                    grid.appendChild(btn);
                }
                container.appendChild(grid);
                return;
            }

            // 2. Show Micro-Themes (Always stays visible)
            let gradIndex = 0;
            const themes = {};
            paperData[currentSubject].forEach(q => {
                const parts = q.microtheme.split(' x ');
                const root = parts.length > 1 ? parts[0].trim() : q.microtheme;
                if (!themes[root]) themes[root] = [];
                themes[root].push(q);
            });

            container.innerHTML = `
                <div class="breadcrumb">
                    <button class="breadcrumb-btn" onclick="currentSubject=null; currentMicroTheme=null; renderDashboard();">← Subjects</button> / 
                    <span>${currentSubject}</span>
                </div>
                <h2 style="margin-bottom: 20px;">Themes</h2>`;
            
            const grid = document.createElement('div');
            grid.className = 'capsule-grid';
            
            for (const themeRoot in themes) {
                const themeQs = themes[themeRoot];
                const btn = document.createElement('button');
                // Assign gradient based on current count
                btn.className = `capsule-btn ${gradClasses[gradIndex % gradClasses.length]}`;
                gradIndex++;
                
                // IF this is the active theme, add 'active' class for highlight
                if (currentMicroTheme === themeRoot) {
                    btn.classList.add('active');
                }

                btn.innerHTML = `<span>${themeRoot}</span> <span class="capsule-count">${themeQs.length}</span>`;
                
                // TOGGLE LOGIC: If clicked same theme -> collapse. If new theme -> expand.
                btn.onclick = () => {
                    if (currentMicroTheme === themeRoot) {
                        currentMicroTheme = null; // Collapse
                    } else {
                        currentMicroTheme = themeRoot; // Expand
                    }
                    renderDashboard();
                };
                grid.appendChild(btn);
            }
            container.appendChild(grid);

            // 3. Show Questions ONLY if a microtheme is selected (Below the tags)
            if (currentMicroTheme) {
                const qList = paperData[currentSubject].filter(q => {
                    const parts = q.microtheme.split(' x ');
                    const root = parts.length > 1 ? parts[0].trim() : q.microtheme;
                    return root === currentMicroTheme;
                });

                const qContainer = document.createElement('div');
                qContainer.className = 'questions-container';
                
                qContainer.innerHTML = `<h2 style="margin-bottom: 20px;">${currentMicroTheme} (${qList.length} Questions)</h2>`;

                qList.forEach(q => {
                    const qDiv = document.createElement('div');
                    qDiv.className = 'q-item';
                    qDiv.innerHTML = `
                        <div class="exp-badges">
                            <span class="badge badge-year">📅 ${q.year}</span>
                            <span class="badge badge-marks">🎯 ${q.marks} Marks</span>
                            <span class="badge badge-paper">📚 ${q.paper}</span>
                            <span class="badge badge-subject">${q.subject}</span>
                        </div>
                        <div class="q-text">${q.key_pyq}</div>
                        <div class="exp-actions">
                            <button class="btn-action" onclick="alert('Generate Answer for Year ${q.year}!')">✨ Generate Answer</button>
                            <button class="btn-save" onclick="alert('Saved!')">💾 Save</button>
                        </div>`;
                    qContainer.appendChild(qDiv);
                });

                container.appendChild(qContainer);
            }
        }

        function renderCharts() {
            let allQuestions = [];
            const paperData = allData[currentPaper] || {};
            for(const subject in paperData) {
                allQuestions = allQuestions.concat(paperData[subject]);
            }

            document.getElementById('trend-title').textContent = `Trend by Year - ${currentPaper}`;
            document.getElementById('topic-title').textContent = `Most Repeated - ${currentPaper}`;
            document.getElementById('radar-title').textContent = `Radar - ${currentPaper}`;

            drawTrendChart(allQuestions);
            drawTopicChart(allQuestions);
            drawRadarChart(allQuestions);
        }

        function drawTrendChart(data) {
            const years = {}; data.forEach(q => years[q.year] = (years[q.year] || 0) + 1);
            const labels = Object.keys(years).sort();
            const counts = labels.map(y => years[y]);
            const ctx = document.getElementById('trendChart').getContext('2d');
            if(myCharts.trend) myCharts.trend.destroy();
            myCharts.trend = new Chart(ctx, {
                type: 'line',
                data: { labels, datasets: [{ data: counts, borderColor: getComputedStyle(document.body).getPropertyValue('--accent'), backgroundColor: getComputedStyle(document.body).getPropertyValue('--accent-soft'), fill: true, tension: 0.4, pointRadius: 4 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false } }, y: { beginAtZero: true } } }
            });
        }

        function drawTopicChart(data) {
            const topics = {}; data.forEach(q => topics[q.microtheme] = (topics[q.microtheme] || 0) + 1);
            const sorted = Object.entries(topics).sort((a, b) => b[1] - a[1]).slice(0, 6);
            const labels = sorted.map(t => t[0]); const counts = sorted.map(t => t[1]);
            const ctx = document.getElementById('topicChart').getContext('2d');
            if(myCharts.topic) myCharts.topic.destroy();
            myCharts.topic = new Chart(ctx, {
                type: 'bar',
                data: { labels, datasets: [{ data: counts, backgroundColor: getComputedStyle(document.body).getPropertyValue('--primary'), borderRadius: 6 }] },
                options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, grid: { display: false } }, y: { grid: { display: false } } } }
            });
        }

        function drawRadarChart(data) {
            const ctx = document.getElementById('radarChart').getContext('2d');
            const topics = {}; data.forEach(q => topics[q.microtheme] = (topics[q.microtheme] || 0) + 1);
            const sorted = Object.entries(topics).sort((a, b) => b[1] - a[1]).slice(0, 5);
            const labels = sorted.map(t => t[0]); const counts = sorted.map(t => t[1]);
            if(myCharts.radar) myCharts.radar.destroy();
            myCharts.radar = new Chart(ctx, {
                type: 'radar',
                data: { labels, datasets: [{ data: counts, backgroundColor: getComputedStyle(document.body).getPropertyValue('--accent-soft'), borderColor: getComputedStyle(document.body).getPropertyValue('--accent'), pointBackgroundColor: getComputedStyle(document.body).getPropertyValue('--accent'), borderWidth: 2 }] },
                options: { responsive: true, maintainAspectRatio: false, scales: { r: { beginAtZero: true } }, plugins: { legend: { display: false } } }
            });
        }

        loadData();
    </script>
</body>
</html>
