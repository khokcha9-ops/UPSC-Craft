<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPSC Craft | PYQ Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #f8fafc; --surface: #ffffff; --surface-2: #f1f5f9;
            --border: #e2e8f0; --text: #0f172a; --text-soft: #64748b;
            --accent: #e11d48; --accent-hover: #be123c; --accent-soft: #ffe4e6;
            --primary: #6366f1; --primary-soft: #e0e7ff;
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }
        body.dark-mode {
            --bg: #0f172a; --surface: #1e293b; --surface-2: #334155;
            --border: #334155; --text: #f1f5f9; --text-soft: #94a3b8;
            --accent: #f43f5e; --accent-hover: #e11d48; --accent-soft: #4c0519;
            --primary: #818cf8; --primary-soft: #312e81;
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.3), 0 1px 2px -1px rgb(0 0 0 / 0.3);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.3), 0 4px 6px -4px rgb(0 0 0 / 0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Mobile Overlay */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 90; display: none; opacity: 0; transition: opacity 0.3s; }
        .overlay.show { display: block; opacity: 1; }

        /* Header */
        .header { height: 70px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; flex-shrink: 0; z-index: 100; }
        .logo { display: flex; align-items: center; gap: 12px; font-weight: 900; font-size: 20px; }
        .logo-icon { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #e11d48, #fb7185); color: white; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        
        .header-controls { display: flex; gap: 16px; align-items: center; }
        .btn-back { text-decoration: none; background: var(--surface-2); border: 1px solid var(--border); color: var(--text); padding: 8px 16px; border-radius: 8px; font-weight: 800; font-size: 14px; transition: 0.2s; }
        .btn-back:hover { background: var(--accent); color: white; border-color: var(--accent); }
        
        .search-box { display: flex; align-items: center; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 8px 16px; width: 300px; }
        .search-box input { border: none; background: transparent; outline: none; flex: 1; color: var(--text); font-size: 14px; }
        .search-box input::placeholder { color: var(--text-soft); }
        .theme-toggle { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 700; }
        .theme-toggle:hover { background: var(--accent); color: white; border-color: var(--accent); }
        .hamburger { display: none; background: none; border: none; color: var(--text); font-size: 24px; cursor: pointer; }

        /* Layout */
        .container { display: flex; flex: 1; overflow: hidden; position: relative; }

        /* Sidebar */
        .sidebar { width: 360px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: relative; z-index: 95; transition: transform 0.3s ease; }
        
        /* Center Paper Tabs */
        .paper-tabs { display: flex; justify-content: center; padding: 12px; gap: 8px; border-bottom: 1px solid var(--border); background: var(--surface); }
        .paper-tab { flex: 1; max-width: 100px; padding: 10px; text-align: center; background: transparent; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-weight: 800; color: var(--text-soft); transition: 0.2s; }
        .paper-tab.active { background: var(--accent); color: white; border-color: var(--accent); }
        
        .nav-scroll { flex: 1; overflow-y: auto; padding: 12px; }
        .nav-scroll::-webkit-scrollbar { width: 6px; }
        .nav-scroll::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 4px; }

        /* Accordion */
        .broad-title { font-size: 11px; font-weight: 900; text-transform: uppercase; color: var(--primary); margin: 16px 8px 8px; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
        
        .group-btn { width: 100%; display: flex; justify-content: space-between; align-items: center; background: var(--surface-2); border: none; padding: 12px 14px; border-radius: 8px; margin-bottom: 4px; cursor: pointer; font-weight: 800; color: var(--text); }
        .group-btn:hover { background: var(--primary-soft); color: var(--primary); }
        .group-btn.active-group { background: var(--primary-soft); color: var(--primary); }
        .group-arrow { transition: transform 0.2s; font-size: 14px; }
        .group-btn.open .group-arrow { transform: rotate(90deg); }
        
        .micro-list { display: none; margin-left: 12px; border-left: 3px solid var(--accent); padding-left: 10px; margin-bottom: 8px; }
        .micro-list.open { display: block; }
        .micro-btn { width: 100%; text-align: left; padding: 10px 12px; background: transparent; border: none; border-radius: 6px; cursor: pointer; color: var(--text-soft); font-size: 13px; font-weight: 700; margin-bottom: 2px; border: 1px solid transparent; display: flex; justify-content: space-between; align-items: center; }
        .micro-btn:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
        .micro-btn.active-micro { background: var(--accent); color: white; font-weight: 800; }
        
        /* Direct buttons (no sub-themes) */
        .direct-theme-btn { background: var(--surface-2); color: var(--text); border: none; width: 100%; text-align: left; padding: 12px 14px; border-radius: 8px; margin-bottom: 4px; cursor: pointer; font-weight: 800; display: flex; justify-content: space-between; align-items: center; }
        .direct-theme-btn:hover { background: var(--accent-soft); color: var(--accent); }
        .direct-theme-btn.active-micro { background: var(--accent); color: white; }

        /* Count Badges */
        .count-badge { background: var(--surface); border: 1px solid var(--border); color: var(--text-soft); padding: 2px 8px; border-radius: 50px; font-size: 12px; font-weight: 800; min-width: 28px; text-align: center; }
        .active-micro .count-badge, .direct-theme-btn.active-micro .count-badge, .group-btn:hover .count-badge { background: rgba(255,255,255,0.3); border-color: transparent; color: white; }

        /* Main Content */
        .main-content { flex: 1; overflow-y: auto; padding: 24px; background: var(--bg); }
        
        /* Summary Section */
        .paper-summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .sum-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
        .sum-value { font-size: 28px; font-weight: 900; color: var(--accent); }
        .sum-label { font-size: 12px; color: var(--text-soft); font-weight: 600; }

        /* Explorer */
        .explorer-section { background: var(--surface); border: 2px solid var(--border); border-radius: 20px; padding: 24px; box-shadow: var(--shadow-lg); margin-bottom: 30px; }
        .exp-badges { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
        .badge { font-size: 13px; font-weight: 900; padding: 6px 12px; border-radius: 50px; }
        .badge-year { background: var(--accent); color: white; }
        .badge-paper { background: var(--primary); color: white; }
        .badge-marks { background: var(--primary-soft); color: var(--primary); }
        .badge-subject { background: var(--surface-2); color: var(--text-soft); border: 1px solid var(--border); }
        .q-text { font-size: 22px; font-weight: 800; line-height: 1.6; margin-bottom: 24px; }
        .exp-actions { display: flex; gap: 12px; }
        .btn-action { background: var(--accent); color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: 800; cursor: pointer; transition: 0.2s; }
        .btn-action:hover { background: var(--accent-hover); transform: translateY(-2px); }
        .btn-save { background: transparent; border: 2px solid var(--border); color: var(--text); padding: 12px 20px; border-radius: 10px; font-weight: 800; cursor: pointer; transition: 0.2s; }
        .btn-save:hover { border-color: var(--accent); color: var(--accent); }

        /* Chart Section */
        .charts-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
        .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); }
        .chart-card h3 { font-size: 16px; font-weight: 900; margin-bottom: 15px; }
        .chart-container { height: 250px; position: relative; }
        
        @media (max-width: 900px) {
            .header { padding: 0 16px; }
            .btn-back { display: none; } /* Hide back button on mobile to save space */
            .search-box { display: none; }
            .hamburger { display: block; }
            .sidebar { position: fixed; top: 0; left: 0; height: 100%; transform: translateX(-100%); width: 320px; }
            .sidebar.open { transform: translateX(0); }
            .main-content { padding: 16px; }
            .paper-summary { grid-template-columns: repeat(2, 1fr); }
            .charts-row { grid-template-columns: 1fr; }
            .q-text { font-size: 18px; }
            .exp-actions { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="toggleSidebar(false)"></div>

    <div class="header">
        <div class="logo"><div class="logo-icon">🦉</div> UPSC CRAFT</div>
        <div class="header-controls">
            <!-- Added Back to Main Site Button -->
            <a href="index.html" class="btn-back">← Back to Site</a>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search questions, themes...">
            </div>
            <button class="theme-toggle" onclick="toggleTheme()">🌓 Theme</button>
            <button class="hamburger" onclick="toggleSidebar(true)">☰</button>
        </div>
    </div>

    <div class="container">
        <div class="sidebar" id="sidebar">
            <div class="paper-tabs">
                <button class="paper-tab active" onclick="selectPaper('GS1')">GS1</button>
                <button class="paper-tab" onclick="selectPaper('GS2')">GS2</button>
                <button class="paper-tab" onclick="selectPaper('GS3')">GS3</button>
                <button class="paper-tab" onclick="selectPaper('GS4')">GS4</button>
            </div>
            <div class="nav-scroll" id="sidebar-nav">
                <!-- Loaded dynamically -->
            </div>
        </div>

        <div class="main-content">
            <div class="paper-summary" id="paperSummary">
                <div class="sum-card"><div class="sum-value" id="sum-qs">0</div><div class="sum-label">Total Questions</div></div>
                <div class="sum-card"><div class="sum-value" id="sum-themes">0</div><div class="sum-label">Micro-Themes</div></div>
                <div class="sum-card"><div class="sum-value" id="sum-years">0</div><div class="sum-label">Years Covered</div></div>
                <div class="sum-card"><div class="sum-value" id="sum-recent">0</div><div class="sum-label">2026 Questions</div></div>
            </div>

            <div class="explorer-section">
                <div class="exp-badges" id="expBadges"></div>
                <div class="q-text" id="qText">Select a micro-theme to explore</div>
                <div class="exp-actions">
                    <button class="btn-action" onclick="alert('AI Answer Generation Coming Soon!')">✨ Generate Answer</button>
                    <button class="btn-save" onclick="alert('Question Saved to Bookmarks!')">💾 Save Question</button>
                </div>
            </div>

            <div class="charts-row">
                <div class="chart-card">
                    <h3 id="trend-title">Trend by Year</h3>
                    <div class="chart-container"><canvas id="trendChart"></canvas></div>
                </div>
                <div class="chart-card">
                    <h3 id="topic-title">Most Repeated Themes</h3>
                    <div class="chart-container"><canvas id="topicChart"></canvas></div>
                </div>
                <div class="chart-card">
                    <h3 id="radar-title">Radar</h3>
                    <div class="chart-container"><canvas id="radarChart"></canvas></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
        }

        function toggleSidebar(open) {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            if(open) {
                sidebar.classList.add('open');
                overlay.classList.add('show');
            } else {
                sidebar.classList.remove('open');
                overlay.classList.remove('show');
            }
        }

        const MajorMap = {
            'GS1': { 'Art & Culture': ['Indian Heritage & Culture'], 'Modern History': ['Modern Indian History'], 'Post Independence': ['Post Independence'], 'World History': ['World History'], 'Physical Geography': ['Physical Geography'], 'Economic & Human Geography': ['Economic & Human Geography'], 'Indian society': ['Indian Society', 'Society'] },
            'GS2': { 'Polity': ['Polity'], 'Governance': ['Governance'], 'Social Justice': ['Social Justice'], 'International Relations': ['International Relations'] },
            'GS3': { 'Economy': ['Economic Development'], 'Agriculture': ['Agriculture'], 'Internal Security': ['Internal Security'], 'Environment & Disaster Management': ['Environment', 'Disaster Management'], 'Science & Tech': ['Science & Technology'] },
            'GS4': { 'Ethics Theory': ['Ethics'], 'Case Studies': ['Case Studies'] }
        };

        let allData = {};
        let currentPaper = 'GS1';
        let myCharts = {};

        async function loadData() {
            const files = { 'GS1': './gs1_themes.json', 'GS2': './gs2_themes.json', 'GS3': './gs3_themes.json', 'GS4': './gs4_themes.json' };
            const results = await Promise.all(Object.entries(files).map(async ([paper, url]) => {
                try { const res = await fetch(url); if (!res.ok) return { paper, data: {} }; return { paper, data: await res.json() }; } catch(e) { return { paper, data: {} }; }
            }));

            results.forEach(res => {
                const grouped = {};
                
                // **FIXED**: Handles BOTH JSON formats (Wrapped in GS1, GS2, etc. OR Unwrapped)
                const rawPaperData = res.data[res.paper] ? res.data[res.paper] : res.data;
                
                for (const broadSubject in MajorMap[res.paper]) {
                    const rawKeys = MajorMap[res.paper][broadSubject];
                    grouped[broadSubject] = [];
                    rawKeys.forEach(key => {
                        if(rawPaperData[key]) {
                            // **FIXED**: Injecting the subject here so it doesn't show "undefined"
                            rawPaperData[key].forEach(q => {
                                q.subject = broadSubject;
                            });
                            grouped[broadSubject] = grouped[broadSubject].concat(rawPaperData[key]);
                        }
                    });
                }
                for (const subject in rawPaperData) {
                    let isFound = false;
                    for(const broadSubject in MajorMap[res.paper]) {
                        if(MajorMap[res.paper][broadSubject].includes(subject)) isFound = true;
                    }
                    if(!isFound) {
                        // **FIXED**: Injecting fallback subject
                        rawPaperData[subject].forEach(q => {
                            q.subject = 'General';
                        });
                        grouped['General'] = (grouped['General'] || []).concat(rawPaperData[subject]);
                    }
                }
                allData[res.paper] = grouped;
            });

            selectPaper('GS1');
        }

        function selectPaper(paper) {
            currentPaper = paper;
            document.querySelectorAll('.paper-tab').forEach(tab => tab.classList.toggle('active', tab.textContent === paper));
            renderSidebar();
            renderDashboard();
            toggleSidebar(false);
            // Auto-select the first question in the sidebar so it's never empty!
            const firstBtn = document.querySelector('.micro-btn, .direct-theme-btn');
            if (firstBtn) firstBtn.click();
        }

        function renderSidebar() {
            const nav = document.getElementById('sidebar-nav');
            nav.innerHTML = '';
            const paperData = allData[currentPaper];

            if(!paperData || Object.keys(paperData).length === 0) {
                nav.innerHTML = `<div style="padding: 20px; color: var(--text-soft);">No data found for ${currentPaper}.</div>`;
                return;
            }

            for (const broadSubject in paperData) {
                const title = document.createElement('div');
                title.className = 'broad-title';
                title.textContent = broadSubject;
                nav.appendChild(title);

                const questions = paperData[broadSubject];
                
                const themeGroups = {};
                questions.forEach(q => {
                    const parts = q.microtheme.split(' x ');
                    const root = parts.length > 1 ? parts[0].trim() : q.microtheme;
                    if(!themeGroups[root]) themeGroups[root] = [];
                    themeGroups[root].push(q);
                });

                for (const rootTheme in themeGroups) {
                    const themeArr = themeGroups[rootTheme];

                    if (themeArr.every(q => q.microtheme === rootTheme)) {
                        const btn = document.createElement('button');
                        btn.className = 'direct-theme-btn';
                        btn.innerHTML = `<span>${rootTheme}</span> <span class="count-badge">${themeArr.length}</span>`;
                        btn.onclick = () => showQuestion(themeArr[0], btn);
                        nav.appendChild(btn);
                        continue;
                    }

                    const id = `${currentPaper}-${broadSubject}-${rootTheme}`;
                    const groupBtn = document.createElement('button');
                    groupBtn.className = 'group-btn';
                    groupBtn.innerHTML = `<span>${rootTheme}</span> <span class="count-badge">${themeArr.length}</span> <span class="group-arrow">›</span>`;
                    groupBtn.onclick = () => {
                        const list = document.getElementById(`list-${id}`);
                        const isOpen = list.classList.contains('open');
                        document.querySelectorAll('.micro-list').forEach(l => l.classList.remove('open'));
                        document.querySelectorAll('.group-btn').forEach(b => b.classList.remove('open'));
                        if(!isOpen) { list.classList.add('open'); groupBtn.classList.add('open'); }
                    };
                    nav.appendChild(groupBtn);

                    const microList = document.createElement('div');
                    microList.className = 'micro-list';
                    microList.id = `list-${id}`;

                    const microCounts = {};
                    themeArr.forEach(q => {
                        microCounts[q.microtheme] = (microCounts[q.microtheme] || 0) + 1;
                    });

                    for (const microTheme in microCounts) {
                        const count = microCounts[microTheme];
                        const microBtn = document.createElement('button');
                        microBtn.className = 'micro-btn';
                        microBtn.innerHTML = `<span>${microTheme}</span> <span class="count-badge">${count}</span>`;
                        const firstQ = themeArr.find(q => q.microtheme === microTheme);
                        microBtn.onclick = () => showQuestion(firstQ, microBtn);
                        microList.appendChild(microBtn);
                    }
                    nav.appendChild(microList);
                }
            }
        }

        function showQuestion(q, btnElement) {
            document.querySelectorAll('.micro-btn, .direct-theme-btn').forEach(b => b.classList.remove('active-micro'));
            btnElement.classList.add('active-micro');

            document.getElementById('expBadges').innerHTML = `
                <span class="badge badge-year">📅 ${q.year}</span>
                <span class="badge badge-marks">🎯 ${q.marks} Marks</span>
                <span class="badge badge-paper">📚 ${q.paper}</span>
                <span class="badge badge-subject">${q.subject || 'Broad Subject'}</span>
                <span class="badge badge-subject">${q.microtheme}</span>
            `;
            document.getElementById('qText').textContent = q.key_pyq;
        }

        function renderDashboard() {
            let allQuestions = [];
            const paperData = allData[currentPaper] || {};
            for(const subject in paperData) {
                allQuestions = allQuestions.concat(paperData[subject]);
            }

            const totalQs = allQuestions.length;
            const totalThemes = new Set(allQuestions.map(q => q.microtheme)).size;
            const totalYears = new Set(allQuestions.map(q => q.year)).size;
            const recentQs = allQuestions.filter(q => q.year === '2026').length;

            document.getElementById('sum-qs').textContent = totalQs;
            document.getElementById('sum-themes').textContent = totalThemes;
            document.getElementById('sum-years').textContent = totalYears;
            document.getElementById('sum-recent').textContent = recentQs;

            document.getElementById('trend-title').textContent = `Trend by Year - ${currentPaper}`;
            document.getElementById('topic-title').textContent = `Most Repeated Themes - ${currentPaper}`;
            document.getElementById('radar-title').textContent = `Theme Radar - ${currentPaper}`;

            drawTrendChart(allQuestions);
            drawTopicChart(allQuestions);
            drawRadarChart(allQuestions);
        }

        function drawTrendChart(data) {
            const years = {}; data.forEach(q => years[q.year] = (years[q.year] || 0) + 1);
            const labels = Object.keys(years).sort();
            const counts = labels.map(y => years[y]);
            const ctx = document.getElementById('trendChart').getContext('2d');
            if(myCharts.trend) myCharts.trend.destroy();
            myCharts.trend = new Chart(ctx, {
                type: 'line',
                data: { labels, datasets: [{ data: counts, borderColor: '#e11d48', backgroundColor: 'rgba(225,29,72,0.1)', fill: true, tension: 0.4, pointRadius: 4 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false } }, y: { beginAtZero: true } } }
            });
        }

        function drawTopicChart(data) {
            const topics = {}; data.forEach(q => topics[q.microtheme] = (topics[q.microtheme] || 0) + 1);
            const sorted = Object.entries(topics).sort((a, b) => b[1] - a[1]).slice(0, 6);
            const labels = sorted.map(t => t[0]); const counts = sorted.map(t => t[1]);
            const ctx = document.getElementById('topicChart').getContext('2d');
            if(myCharts.topic) myCharts.topic.destroy();
            myCharts.topic = new Chart(ctx, {
                type: 'bar',
                data: { labels, datasets: [{ data: counts, backgroundColor: '#6366f1', borderRadius: 6 }] },
                options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, grid: { display: false } }, y: { grid: { display: false } } } }
            });
        }

        function drawRadarChart(data) {
            const ctx = document.getElementById('radarChart').getContext('2d');
            const topics = {}; data.forEach(q => topics[q.microtheme] = (topics[q.microtheme] || 0) + 1);
            const sorted = Object.entries(topics).sort((a, b) => b[1] - a[1]).slice(0, 5);
            const labels = sorted.map(t => t[0]); const counts = sorted.map(t => t[1]);
            if(myCharts.radar) myCharts.radar.destroy();
            myCharts.radar = new Chart(ctx, {
                type: 'radar',
                data: { labels, datasets: [{ data: counts, backgroundColor: 'rgba(225,29,72,0.2)', borderColor: '#e11d48', pointBackgroundColor: '#e11d48', borderWidth: 2 }] },
                options: { responsive: true, maintainAspectRatio: false, scales: { r: { beginAtZero: true } }, plugins: { legend: { display: false } } }
            });
        }

        document.getElementById('searchInput').addEventListener('input', debounce(applySearch, 300));
        function applySearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const nav = document.getElementById('sidebar-nav');
            const buttons = nav.querySelectorAll('.micro-btn, .direct-theme-btn');
            buttons.forEach(btn => {
                const text = btn.textContent.toLowerCase();
                if(text.includes(query)) btn.style.display = 'flex';
                else btn.style.display = 'none';
            });
        }

        function debounce(func, wait) {
            let timeout;
            return function(...args) { clearTimeout(timeout); timeout = setTimeout(() => func.apply(this, args), wait); };
        }

        loadData();
    </script>
</body>
</html>
