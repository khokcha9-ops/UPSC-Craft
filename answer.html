<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Model Answer - UPSC CRAFT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Merriweather:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
  <style>
    :root {
      --bg: #faf9f6; --surface: #ffffff; --border: #e5e5e5;
      --text: #1a1a1a; --text-soft: #6b6b6b; --accent: #D96B00;
      --heading-color: #1a1a1a;
      --kw-term-color: #1d4ed8; --kw-term-bg: #dbeafe;
      --kw-example-color: #047857; --kw-example-bg: #d1fae5;
      --kw-meta-color: #6d28d9; --kw-meta-bg: #ede9fe;
      --kw-highlight-color: #b45309; --kw-highlight-bg: #fef3c7;
      --strong-color: #be123c;
    }
    body.dark-mode {
      --bg: #0B0F19; --surface: #1E293B; --border: #334155;
      --text: #ffffff; --text-soft: #94A3B8; --heading-color: #faf9f6;
      --kw-term-color: #93c5fd; --kw-term-bg: #1e3a8a;
      --kw-example-color: #6ee7b7; --kw-example-bg: #064e3b;
      --kw-meta-color: #c4b5fd; --kw-meta-bg: #4c1d95;
      --kw-highlight-color: #fcd34d; --kw-highlight-bg: #78350f;
      --strong-color: #fb7185;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); line-height: 1.85; font-size: 19px; padding-bottom: 60px; transition: background 0.3s, color 0.3s; }
    header { background: var(--accent); color: #fff; padding: 40px 24px 70px; position: relative; }
    .header-content { max-width: 860px; margin: 0 auto; padding-right: 50px; }
    .eyebrow { display: inline-block; background: rgba(255,255,255,0.15); padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 16px; }
    header h1 { font-family: 'Merriweather', serif; font-size: 28px; font-weight: 700; line-height: 1.4; margin: 0; }
    .meta-tag { display: inline-block; background: rgba(255,255,255,0.18); padding: 4px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; margin-top: 10px; }
    .theme-toggle { position: absolute; top: 32px; right: 24px; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .wrap { max-width: 860px; margin: -36px auto 60px; padding: 0 16px; }
    .card { background: var(--surface); border-radius: 16px; padding: 40px 48px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid var(--border); transition: background 0.3s, border 0.3s; }
    .status { display: flex; align-items: center; gap: 12px; color: var(--text-soft); font-style: italic; padding: 20px 0; }
    .spinner { width: 20px; height: 20px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    #content h1, #content h2, #content h3, #content h4 { font-family: 'Merriweather', serif; color: var(--heading-color); border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    #content strong { color: var(--strong-color); font-weight: 700; }
    #content .kw-term { color: var(--kw-term-color); background: var(--kw-term-bg); font-weight: 700; padding: 2px 6px; border-radius: 4px; }
    #content .kw-example, #content .eg, #content em { color: var(--kw-example-color); background: var(--kw-example-bg); font-style: normal; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
    #content .kw-meta, #content .tag-meta { color: var(--kw-meta-color); background: var(--kw-meta-bg); font-weight: 700; padding: 2px 6px; border-radius: 4px; }
    #content .kw-highlight, #content mark.highlight { color: var(--kw-highlight-color); background: var(--kw-highlight-bg); font-weight: 700; padding: 2px 6px; border-radius: 4px; }
    #content table { width: 100%; border-collapse: collapse; margin: 24px 0; border: 1px solid var(--border); font-size: 17px; }
    #content th { background: var(--bg); color: var(--heading-color); padding: 14px; text-align: left; border-bottom: 1px solid var(--border); }
    #content td { padding: 14px; border-bottom: 1px solid var(--border); }
    
    .action-bar { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
    .print-btn, .copy-btn { background: var(--accent); color: #fff; border: none; padding: 12px 24px; border-radius: 999px; font-weight: 600; font-size: 14px; cursor: pointer; }
    .copy-btn { background: var(--text); }
    .error-box { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171; padding: 16px 20px; border-radius: 10px; }
    @media print { header, .action-bar, .theme-toggle { display: none !important; } body { background: #fff !important; color: #000 !important; } .wrap { margin-top: 0 !important; } .card { box-shadow: none !important; border: none !important; padding: 0 !important; } }
    @media (max-width: 640px) { .card { padding: 24px 16px; } #content p, #content ul, #content ol { font-size: 17px; } }
  </style>
</head>
<body>
  <header>
    <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">🌙 Dark</button>
    <div class="header-content">
      <div class="eyebrow">✨ AI Model Answer</div>
      <h1 id="q-title">Loading Question...</h1>
      <div id="q-meta" class="meta-tag" style="display:none;"></div>
    </div>
  </header>

  <div class="wrap">
    <div class="card">
      <div id="status" class="status"><span class="spinner"></span> Synthesizing model answer via AI...</div>
      <div id="content"></div>
      <div class="action-bar">
        <button id="print-btn" class="print-btn" style="display:none;" onclick="window.print()">🖨 Print / PDF</button>
        <button id="copy-btn" class="copy-btn" style="display:none;" onclick="copyContent()">📋 Copy</button>
      </div>
    </div>
  </div>

  <script>
    const AI_PROXY_URL = "https://qcap-ai-v2.khokcha9.workers.dev/api/generate-answer";
    const themeBtn = document.getElementById('theme-btn');
    if(localStorage.getItem('qcab_theme') === 'dark') {
        document.body.classList.add('dark-mode');
        themeBtn.textContent = '☀️ Light';
    }
    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('qcab_theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
        themeBtn.textContent = document.body.classList.contains('dark-mode') ? '☀️ Light' : '🌙 Dark';
    }

    const urlParams = new URLSearchParams(window.location.search);
    const question = urlParams.get('q') || '';
    const year = urlParams.get('y') || '';
    const marks = urlParams.get('m') || '';
    const subject = urlParams.get('paper') || 'gs1';

    const titleEl = document.getElementById('q-title');
    const metaEl = document.getElementById('q-meta');
    const statusEl = document.getElementById('status');
    const contentEl = document.getElementById('content');
    const printBtn = document.getElementById('print-btn');
    const copyBtn = document.getElementById('copy-btn');

    if (!question) {
      statusEl.style.display = 'none';
      contentEl.innerHTML = `<div class="error-box">❌ No question provided in the URL.</div>`;
    } else {
      titleEl.textContent = question;
      if (marks || year) {
        metaEl.style.display = 'inline-block';
        metaEl.textContent = `${marks ? marks : ''} ${year ? '/ ' + year : ''}`.trim();
      }
      fetchAnswer();
    }

    async function fetchAnswer() {
      try {
        const res = await fetch(AI_PROXY_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: question, subject: subject })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || data.message || `Server error (${res.status})`);
        statusEl.style.display = 'none';
        let answerMarkdown = data.text || data.answer || null;
        if (!answerMarkdown) throw new Error('The AI returned an empty response. Please try again.');
        if (window.marked) {
          marked.setOptions({ breaks: true, gfm: true });
          contentEl.innerHTML = marked.parse(answerMarkdown);
        } else {
          contentEl.textContent = answerMarkdown;
        }
        printBtn.style.display = 'inline-block';
        copyBtn.style.display = 'inline-block';
      } catch (err) {
        console.error(err);
        statusEl.style.display = 'none';
        contentEl.innerHTML = `<div class="error-box">❌ ${err.message}</div>`;
      }
    }

    function copyContent() {
      const text = contentEl.innerText;
      navigator.clipboard.writeText(text).then(() => alert('Answer copied to clipboard!')).catch(() => alert('Failed to copy.'));
    }
  </script>
</body>
</html>
