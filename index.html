<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>UPSC Craft | Mains PYQ cum QCAB Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=10000">
</head>
<body>
<script>
  var APP_VERSION = '10.0'; 
  if (localStorage.getItem('qcab_app_version') !== APP_VERSION) {
    localStorage.removeItem('qcab_user'); localStorage.removeItem('userToken');
    localStorage.removeItem('qcab_nested_folders'); localStorage.removeItem('qcab_preset_bank'); 
    localStorage.removeItem('user_progress'); localStorage.setItem('qcab_app_version', APP_VERSION);
  }
</script>
<script>
  if (!localStorage.getItem('qcab_user')) {
    localStorage.setItem('qcab_user', JSON.stringify({ email: 'guest@test.com', name: 'Guest', token: 'guest-token' }));
  }
</script>

<div class="app">
  <aside class="sidebar" id="main-sidebar">
    <div class="sidebar-header-mobile">
      <span style="font-weight:750; font-size:13px; color:var(--muted);">Navigation Menu</span>
      <button type="button" class="mobile-menu-close" id="mobile-menu-close">✕</button>
    </div>
    <div class="brand">
      <img src="logo.png" alt="UPSC Craft Logo" class="brand-logo">
    </div>

    <div class="nav-title">Workspace</div>
    <nav class="nav">
      <button type="button" class="nav-btn active" data-scroll="dashboard"><span class="nav-icon">⌂</span>Dashboard</button>
      <button type="button" class="nav-btn" data-scroll="pyq-bank"><span class="nav-icon">▤</span>PYQ Bank</button>
      <button type="button" class="nav-btn" data-scroll="create-question"><span class="nav-icon">＋</span>Create Question</button>
      <button type="button" class="nav-btn" data-scroll="my-qcab"><span class="nav-icon">▣</span>My QCAB</button>
      <button type="button" class="nav-btn" data-scroll="my-study"><span class="nav-icon">📘</span>My Study</button>
    </nav>

    <button type="button" class="nav-btn syllabus-btn" onclick="openSyllabusModal()">
      <span class="nav-icon">📚</span>
      <span>View Syllabus</span>
    </button>
    
    <!-- Study progress (optional but useful) -->
    <div class="sidebar-progress" id="sidebar-progress" style="display:none; margin-top:20px; padding:10px; background:var(--surface-2); border-radius:12px;">
      <div style="font-size:11px; font-weight:800; color:var(--muted); margin-bottom:8px;">YOUR STUDY PROGRESS</div>
      <div style="display:flex; gap:10px; justify-content:space-around;">
        <span>⭐ <span id="sidebar-bookmarked">0</span></span>
        <span>✅ <span id="sidebar-revised">0</span></span>
        <span>📝 <span id="sidebar-notes">0</span></span>
      </div>
    </div>

    <div class="sidebar-bottom"></div>
  </aside>

  <div class="content">
    <div class="mobile-nav">
      <div class="mobile-brand"><img src="logo.png" alt="UPSC Craft Logo" class="brand-logo-mobile"> UPSC CRAFT</div>
      <div class="mobile-actions-right">
        <button type="button" class="mobile-theme-toggle" id="mobile-theme-toggle">🌙</button>
        <button type="button" class="mobile-menu-toggle" id="mobile-menu-toggle">☰</button>
      </div>
    </div>
    <div class="mobile-menu-backdrop" id="mobile-backdrop"></div>

    <header class="topbar">
      <div>
        <div class="topbar-title">UPSC Mains Answer Writing Workspace</div>
        <div class="topbar-sub">Build, organize and print your question-cum-answer booklet</div>
      </div>
      <div class="topbar-actions">
        <button type="button" class="theme-toggle" id="theme-toggle"><span id="theme-icon">🌙</span><span id="theme-text">Dark Mode</span></button>
        <!-- No login button -->
      </div>
    </header>

    <main class="page">
      <!-- your existing sections: hero, stats, folder, create, pyq, my-qcab, my-study, footer -->
      <!-- They remain exactly as before – I'm not repeating them for brevity -->
      <!-- ... -->
      <!-- just make sure the modals are included as before -->
    </main>
  </div>
</div>

<!-- ====== MODALS ====== -->
<!-- Custom Modal -->
<div class="modal-overlay" id="customModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modalTitle">Notice</h2>
      <button class="modal-close" onclick="document.getElementById('customModal').classList.remove('active')">✕</button>
    </div>
    <div class="modal-body">
      <p id="modalMessage"></p>
      <div id="modalInputContainer" style="display:none; margin-top:12px;">
        <input type="text" id="modalInput" placeholder="Enter value..." style="width:100%; padding:10px; border:1px solid var(--border); border-radius:8px;">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="modalCancelBtn" style="display:none;">Cancel</button>
      <button class="btn btn-primary" id="modalConfirmBtn">OK</button>
    </div>
  </div>
</div>

<!-- AI Model Selection Modal -->
<div class="modal-overlay" id="ai-model-modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>🤖 Choose AI Assistant</h2>
      <button class="modal-close" id="ai-model-close">✕</button>
    </div>
    <div class="modal-body">
      <p style="margin-bottom:15px;">Select where to generate the answer for the selected question.</p>
      <div style="display:grid; gap:10px;">
        <!-- Secret AI: now copies prompt and opens ChatGPT (since answer.html may be missing) -->
        <button class="model-option" data-model="secret" style="background:linear-gradient(135deg,#6366f1,#06b6d4); color:#fff; border:none; padding:14px; border-radius:12px; font-weight:800;">✨ Copy Prompt & Open ChatGPT</button>
        <button class="model-option" data-model="chatgpt" style="background:#10a37f; color:#fff; border:none; padding:14px; border-radius:12px; font-weight:800;">💬 ChatGPT (Copy Prompt)</button>
        <button class="model-option" data-model="deepseek" style="background:#1e293b; color:#fff; border:none; padding:14px; border-radius:12px; font-weight:800;">🔬 DeepSeek (Copy Prompt)</button>
        <button class="model-option" data-model="perplexity" style="background:#8b5cf6; color:#fff; border:none; padding:14px; border-radius:12px; font-weight:800;">🌀 Perplexity (Search)</button>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="cancel-ai-modal">Cancel</button>
    </div>
  </div>
</div>

<!-- Back to Top -->
<button id="back-to-top" style="position:fixed; bottom:24px; right:24px; background:var(--primary); color:#fff; border:none; border-radius:50%; width:50px; height:50px; font-size:24px; box-shadow:0 6px 20px rgba(99,102,241,0.4); display:none; align-items:center; justify-content:center; z-index:999; cursor:pointer;">↑</button>

<!-- Note Modal -->
<div class="study-modal" id="note-modal"><div class="study-modal-content"><h3>📝 Add Note</h3><textarea id="note-textarea"></textarea><div class="btn-row"><button class="btn btn-secondary-sm" id="note-save-btn">Save</button><button class="btn btn-secondary-sm btn-danger" id="note-cancel-btn">Cancel</button></div></div></div>
<div class="toast" id="toast"><span class="toast-icon" id="toastIcon">✅</span><span id="toastMessage">Copied!</span></div>

<!-- Scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
<script src="js/config.js?v=10000"></script>
<script src="js/syllabus-data.js?v=10000"></script>
<script src="js/app.js?v=10000"></script>
<script src="js/features.js?v=10000"></script>
</body>
</html>
